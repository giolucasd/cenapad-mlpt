[project]
name = "cenapad-mlpt"
version = "0.1.0"
description = "Cenapad Machine Learning Project Template"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "lightning>=2.6.0",
    "tensorboard>=2.20.0",
    "torch>=2.10.0",
    "torchmetrics>=1.8.2",
    "torchvision>=0.25.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
